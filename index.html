<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Small Website</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f9f9f9;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    header {
      border-bottom: 2px solid #eaeaea;
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.75rem;
      color: #111;
    }
    p {
      margin-bottom: 1rem;
    }
    .btn {
      display: inline-block;
      background-color: #007bff;
      color: #fff;
      padding: 0.5rem 1rem;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 500;
    }
    .btn:hover {
      background-color: #0056b3;
    }
    footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Hello, World!</h1>
    </header>
    
    <p>Welcome to this small, single-page website built with clean HTML5 and CSS.</p>
    <p>You can edit this code, change the text, or add your own sections easily in any text editor like Notepad or VS Code.</p>
    
    <a href="#" class="btn">Get in Touch</a>

    <footer>
      &copy; 2026 My Small Website. All rights reserved.
    </footer>
  </div>

</body>
</html>
